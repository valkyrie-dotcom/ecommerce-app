{% extends "base.html" %}
{% block title %}Reset Your Password{% endblock title %}
{% block content %}
    <h1>Reset Password</h1>
    <form method="post" action="{% url 'grabsomore:reset_password' %}">
        {% csrf_token %}
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required>

        <label for="password_conf">Confirm new password</label>
        <input type="password" id="password_conf" name="password_conf" required>

        <button type="submit">Reset Password</button>
    </form>
{% endblock content %}
