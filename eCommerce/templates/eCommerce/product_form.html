{% extends "base.html" %}
{% block title %}Product{% endblock title %}
{% block content %}
    <h1>Product</h1>

    {% if form %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
    {% endif %}

    <a class="btn" href="{% url 'eCommerce:my_stores' %}">🏪 Back to My Stores</a>
{% endblock content %}
