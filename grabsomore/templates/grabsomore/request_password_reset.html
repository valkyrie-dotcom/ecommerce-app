{% extends "base.html" %}
{% block title %}Forgot Password{% endblock title %}
{% block content %}
    <h1>Forgot Password?</h1>
    <form method="post">
        {% csrf_token %}
        <label for="email">Enter your email address</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Send Reset Link</button>
    </form>
{% endblock content %}
